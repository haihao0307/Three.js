name: KAOPU Score Instrument R01 QA

on:
  push:
    branches:
      - work/kaopu-score-instrument-r01-20260929
    paths:
      - 'kaopu-score-instrument-r01/**'
      - '.github/workflows/kaopu-score-instrument-r01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://raw.githack.com/${{ github.repository }}/${{ github.sha }}/kaopu-score-instrument-r01/index.html

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Wait for immutable public preview
        shell: bash
        run: |
          for attempt in {1..18}; do
            if curl --fail --location --silent --show-error "$TARGET_URL" > /tmp/kaopu-index.html; then
              grep -q "KAOPU · Score Instrument R01" /tmp/kaopu-index.html && exit 0
            fi
            echo "Public preview not ready yet (attempt $attempt/18)."
            sleep 10
          done
          echo "Public preview did not become available: $TARGET_URL"
          exit 1

      - name: Run desktop and mobile public-browser QA
        run: node kaopu-score-instrument-r01/tests/smoke.mjs

      - name: Upload internal QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaopu-score-instrument-r01-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14
